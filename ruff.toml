# Start with correctness checks; Python formatting is a separate decision.
required-version = "==0.16.10"
target-version = "py39"
force-exclude = true
include = [
    "scripts/**/*.py",
    "profiles/mhfu/tools/**/*.py",
    "profiles/mhfu/tests/**/*.py",
]
extend-exclude = [
    "**/third_party/**",
    "**/generated/**",
    "**/game/**",
    "**/overlays/**",
    "out/**",
    "build/**",
    "dist/**",
]

[lint]
select = ["F", "E9", "E722"]
